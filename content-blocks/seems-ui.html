<div class="seems-page">
</div>

<div id="seems">
    <!--Add Section START-->
    <section class="add-section-js seems-modal seems-modal--level-1 active">
        <select class="select-layout-js">
            <option value="">Select Layout</option>
            <option value="layout-content-with-background">Content with Background</option>
            <option value="layout-2-column-media-left">2-Column Media Left</option>
            <option value="layout-2-column-media-right">2-Column Media Right</option>
            <option value="layout-3-column-cta">3-Column Call-to-Actions</option>
        </select>
        <button class="seems-button seems-manage-button" data-action="add-section">Add Section</button>
        <br /><br />

        <textarea class="page-html-js"></textarea>
        <button class="seems-button seems-manage-button" data-action="copy-to-clipboard">Copy to Clipboard</button>
        <button class="seems-button seems-manage-button" data-action="render-code">Render Code</button>
    </section>
    <!--Add Section END-->

    <!-- ***** -->

    <!--Add Section Content START-->
    <section class="add-section-content-js seems-modal seems-modal--level-2">
        <button class="seems-manage-button" data-action="back">Back</button>
        <h2>Add Section</h2>

        <input type="text" class="seems-url-input hide" placeholder="Input URL Link" />
        <input type="text" class="seems-image-input hide" placeholder="Input image's relative URL" />
        <input type="text" class="seems-image-input-alt hide" placeholder="Input image's ALT value" />

        <!--Quill elements START-->
        <div class="quill-editor-outer">
            <div id="seems-section-editor"></div>
        </div>

        <!-- <button class="seems-button seems-manage-button seems-item-input hide" data-action="add-item" style="width: 100%;">Add Item</button> -->
        <input type="number" step="1" min="1" class="seems-item-input hide" placeholder="Input number of items to add" />

        <div style="text-align: right;"><button class="seems-button seems-manage-button" data-action="save">Save</button></div>
        <!--Quill elements END-->
    </section>
    <!--Add Section Content END-->
</div>

<script>
// Initialize Quill with the ID of your editor div.
const sharedModules = {
    toolbar: [
        // Headers: H1, H2, H3, H4, and normal text (false)
        [{ 'header': [1, 2, 3, 4, false] }],

        // Lists: Ordered and Unordered
        [{ 'list': 'ordered' }, { 'list': 'bullet' }],

        // Text Alignment
        [{ 'align': [] }],

        // Inline Text Formatting
        ['bold', 'italic', 'underline', 'link']
    ],
};

var sectionQuill = new Quill('#seems-section-editor', {
    modules: sharedModules,
    theme: 'snow',
    placeholder: 'Start typing content for the section...'
});
</script>
